services:
  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: pretix
      POSTGRES_PASSWORD: pretix
      POSTGRES_DB: pretix
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pretix"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

  pretix:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8345:80"
    volumes:
      - ./:/plugin
      - ./docker/pretix.cfg:/etc/pretix/pretix.cfg:ro
      - pretix-data:/data

volumes:
  postgres-data:
  pretix-data:
